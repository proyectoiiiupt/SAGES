{# app/templates/notifications/components/card_action.html #}
{% macro render_action_card(notif) %}
<div class="notification-card notification-card-action {% if not notif.is_read %}is-unread{% endif %} trigger-modal" data-notif-id="{{ notif.id }}" data-notif-title="{{ notif.title | forceescape }}" data-notif-message="{{ notif.message | forceescape }}" data-notif-date="{{ notif.created_at.isoformat() ~ 'Z' }}" data-notif-extra="{{ (notif.extra_data or {}) | tojson | forceescape }}">
    <div class="action-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
    </div>
    <div class="action-content">
        <h4 class="action-title">{{ notif.title }}</h4>
        <p class="action-message">{{ notif.message }}</p>
        <span class="action-time local-datetime" data-utc="{{ notif.created_at.isoformat() ~ 'Z' }}" data-format="standard">{{ notif.created_at.strftime('%Y-%m-%d %H:%M') }}</span>
    </div>
    <div class="action-buttons-container">
        {% if notif.redirect_url %}
        <a href="{{ notif.redirect_url }}" class="btn-primary-action history-action-link" data-notif-id="{{ notif.id }}">
            {{ notif.action_text or 'Revisar Solicitud' }}
        </a>
        {% endif %}
        <button class="btn-secondary-action history-mark-read" data-notif-id="{{ notif.id }}" {% if notif.is_read %}disabled{% endif %}>
            {{ 'Leído' if notif.is_read else 'Marcar como leído' }}
        </button>
    </div>
</div>
{% endmacro %}
