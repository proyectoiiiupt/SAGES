<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SAGES - Activación de Cuenta{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon_corpoelec.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/sweetalert2.min.css') }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    {% block extra_css %}{% endblock %}
</head>

<body style="background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;">

    <main style="width: 100%; max-width: 500px; padding: 20px;">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='JS/sweetalert2.all.min.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
